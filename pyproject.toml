[project]
name = "compilador-alcides-murilo"
version = "0.1.0"
description = "Compilador didatico da disciplina de Compiladores"
readme = "README.md"
requires-python = ">=3.8"
dependencies = []

# Comandos do projeto: "uv run lexico", "uv run sintatico", "uv run semantico"
[project.scripts]
lexico = "analisador_lexico:main"
sintatico = "analisador_sintatico:main"
semantico = "analisador_semantico:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
include = ["analisador_lexico.py", "analisador_sintatico.py", "analisador_semantico.py"]
